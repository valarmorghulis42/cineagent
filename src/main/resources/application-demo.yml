# Demo profile: default H2 datasource, a short hold TTL and fast sweep interval so
# scripts/demo.sh can demonstrate hold expiry and the sweeper without a real wait. Catalog/show
# data is created live by scripts/demo.sh via the admin API, on purpose — a recorded demo that
# shows the admin endpoints working beats one that hides setup behind a SQL seed file.
app:
  hold:
    ttl-minutes: 1
    sweep-interval: PT5S
